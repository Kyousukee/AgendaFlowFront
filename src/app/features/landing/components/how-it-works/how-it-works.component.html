<section class="how" id="how-it-works" aria-labelledby="how-title" appScrollReveal>
  <h2 class="how__title" id="how-title" data-reveal>Lista en una tarde.</h2>

  <ol class="how__bar" data-ui>
    @for (e of etapas; track e.duracion) {
      <li class="how__stage how__stage--{{ e.tono }}" data-reveal>
        <div class="how__segment how__segment--{{ e.tono }}">
          <span class="how__duration">{{ e.duracion }}</span>
        </div>
        <p class="how__text">{{ e.texto }}</p>
      </li>
    }
  </ol>
</section>
