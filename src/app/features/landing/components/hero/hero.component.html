<section class="hero" aria-labelledby="hero-title">
  <div class="hero__mosaic" aria-hidden="true">
    <div class="hero__cell hero__cell--p1">
      <img
        src="images/landing/barberia-navaja.webp"
        alt=""
        width="1100"
        height="1648"
        fetchpriority="high"
      />
    </div>
    <div class="hero__cell hero__cell--tall"></div>
    <div class="hero__cell hero__cell--p2">
      <img
        #drift
        src="images/landing/barberia-sillon.webp"
        alt=""
        width="1600"
        height="1063"
        fetchpriority="high"
      />
    </div>
    <div class="hero__cell hero__cell--char"></div>
    <div class="hero__cell hero__cell--p3">
      <img src="images/landing/peluqueria-brushing.webp" alt="" width="1600" height="1068" />
    </div>
    <div class="hero__cell hero__cell--c2"></div>
    <div class="hero__cell hero__cell--p4">
      <img src="images/landing/barberia-herramientas.webp" alt="" width="1600" height="1067" />
    </div>
    <div class="hero__cell hero__cell--gold"></div>
    <div class="hero__cell hero__cell--c3"></div>
  </div>

  <div class="hero__body">
    <h1 class="hero__title" id="hero-title">
      <span class="hero__line"><span class="hero__line-inner">Tu agenda,</span></span>
      <span class="hero__line"><span class="hero__line-inner">sin libreta.</span></span>
    </h1>

    <div class="hero__aside">
      <p class="hero__standfirst" data-hero-fade>
        Agenda online para barberías y peluquerías. Tus clientes reservan su hora solos, a
        cualquier hora, y tú ves el día completo en un panel.
      </p>
      <div class="hero__actions" data-hero-fade>
        <a routerLink="/register" class="hero__cta">Empezar gratis</a>
        <a href="#showcase" class="hero__link">Ver cómo se ve</a>
      </div>
      <p class="hero__note" data-hero-fade>Plan Gratis para siempre. Pro a $19.990 al mes.</p>
    </div>
  </div>
</section>
