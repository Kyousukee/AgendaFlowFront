<nav class="navbar" aria-label="Principal">
  <a routerLink="/" class="navbar__brand" aria-label="AgendaFlow, inicio">
    <img src="logo.png" alt="AgendaFlow" class="navbar__logo-img" width="96" height="48" />
  </a>

  <div class="navbar__links">
    @for (link of links; track link.fragment) {
      <a routerLink="/" [fragment]="link.fragment" class="navbar__link">{{ link.label }}</a>
    }
  </div>

  <div class="navbar__actions">
    <a routerLink="/login" class="navbar__login">Iniciar sesión</a>
    <a routerLink="/register" class="navbar__cta">Empezar gratis</a>
  </div>

  <button
    type="button"
    class="navbar__menu"
    (click)="toggleMenu()"
    [attr.aria-expanded]="mobileMenuOpen()"
    aria-controls="navbar-mobile"
  >
    {{ mobileMenuOpen() ? 'Cerrar' : 'Menú' }}
  </button>
</nav>

@if (mobileMenuOpen()) {
  <div class="navbar__mobile" id="navbar-mobile">
    @for (link of links; track link.fragment) {
      <a
        routerLink="/"
        [fragment]="link.fragment"
        class="navbar__mobile-link"
        (click)="toggleMenu()"
        >{{ link.label }}</a
      >
    }
    <a routerLink="/login" class="navbar__mobile-link" (click)="toggleMenu()">Iniciar sesión</a>
    <a routerLink="/register" class="navbar__mobile-cta" (click)="toggleMenu()">Empezar gratis</a>
  </div>
}
