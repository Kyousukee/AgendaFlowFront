<app-navbar />

<main class="legal" aria-labelledby="legal-title">
  <header class="legal__head">
    <h1 class="legal__title" id="legal-title">{{ titulo() }}</h1>
    <p class="legal__date">Última actualización: {{ actualizado() }}</p>
  </header>

  <div class="legal__layout">
    <nav class="legal__toc" aria-label="Contenido">
      <p class="legal__toc-title">En esta página</p>
      <ol class="legal__toc-list">
        @for (s of secciones(); track s.id) {
          <li>
            <a [routerLink]="rutaActual()" [fragment]="s.id" class="legal__toc-link">{{
              s.titulo
            }}</a>
          </li>
        }
      </ol>
    </nav>

    <article class="legal__body">
      <ng-content />
    </article>
  </div>
</main>

<app-footer />
